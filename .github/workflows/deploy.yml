name: Deploy static game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check src/data.js
          node --check src/main.js
          node --check src/expansion.js
          node --check src/ui-shell.js
          node scripts/smoke-test.js
          node -e "JSON.parse(require('node:fs').readFileSync('assets/manifest.json', 'utf8'))"

      - name: Validate game data references
        run: |
          node <<'NODE'
          global.window = {};
          require('./src/data.js');
          const data = window.RO_DATA;
          for (const job of data.jobs) {
            for (const id of job.skills) if (!data.skills[id]) throw new Error('Missing skill: ' + id + ' in ' + job.id);
          }
          for (const monster of Object.values(data.monsters)) {
            for (const drop of monster.drops) if (!data.items[drop.id]) throw new Error('Missing drop item: ' + drop.id);
          }
          const mapIds = new Set();
          for (const [id, map] of Object.entries(data.maps)) {
            if (mapIds.has(id)) throw new Error('Duplicate map: ' + id);
            mapIds.add(id);
            if (!Array.isArray(map.spawns) || !Array.isArray(map.portals)) throw new Error('Invalid map collections: ' + id);
            for (const spawn of map.spawns) {
              if (!data.monsters[spawn.type]) throw new Error('Missing monster: ' + spawn.type + ' in ' + id);
              if (spawn.x < 0 || spawn.x > 960 || spawn.y < 0 || spawn.y > 600) throw new Error('Spawn outside world bounds: ' + id);
            }
            for (const portal of map.portals) if (!data.maps[portal.to]) throw new Error('Missing portal destination: ' + portal.to + ' from ' + id);
          }
          for (const id of ['geffen', 'morroc', 'payon', 'izlude', 'pyramid', 'glast-heim', 'mvp-lair']) if (!data.maps[id]) throw new Error('Missing expansion map: ' + id);
          for (const id of ['osiris', 'moonlight-flower', 'baphomet']) if (!data.monsters[id] || data.monsters[id].boss !== true) throw new Error('Missing boss configuration: ' + id);
          console.log('Validated jobs, skills, item drops, map coordinates, all portals, expansion towns, dungeons, and MVP bosses.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
