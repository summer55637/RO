name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static game files
        run: |
          mkdir -p _site/assets
          cp index.html style.css core.js app.js world-data.js sw.js _site/
          cp assets/* _site/assets/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
